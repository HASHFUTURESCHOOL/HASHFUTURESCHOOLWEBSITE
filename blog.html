<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Hash Future School</title>
    <meta name="description"
        content="Insights, tips, and stories about alternative education, homeschooling, and future skills from Hash Future School.">
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">
    <meta name="googlebot" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">
    <link rel="canonical" href="https://www.hashfuture.school/blog.html">
    <link rel="alternate" type="text/markdown" title="LLMs" href="https://www.hashfuture.school/llms.txt">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-hash">#</span>Future School</a>
            <div class="nav-links">
                <a href="index.html#outcomes">Outcomes</a>
                <a href="index.html#curriculum">Curriculum</a>
                <a href="super-kids.html" class="superkids-highlight">SuperKids 🚀</a>
            </div>
            <a href="index.html#enroll" class="nav-cta">Enroll Now</a>
        </div>
    </nav>

    <section style="padding: 140px 0 60px; background: var(--bg-light);">
        <div class="container text-center">
            <span class="section-badge">Blog</span>
            <h1 style="font-size: 3rem; margin-top: 20px;">Latest <span class="highlight">Insights</span></h1>
        </div>
    </section>

    <section style="padding: 80px 0;">
        <div class="container">
            <div id="posts-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px;">
            </div>
            <p id="posts-empty" class="hidden"
                style="text-align: center; color: var(--text-medium); padding: 48px 0;">No posts yet — check back soon!</p>
        </div>
    </section>

    <!-- Newsletter -->
    <section style="padding: 72px 0; background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff;">
        <div class="container" style="max-width: 640px; text-align: center;">
            <h2 style="font-size: 1.9rem; margin: 0 0 12px;">Get Future-Ready Insights</h2>
            <p style="opacity: 0.85; margin: 0 0 24px; font-size: 1.05rem;">Join our newsletter for parenting tips,
                future skills, and school updates. No spam — unsubscribe anytime.</p>
            <form class="newsletter-form"
                style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <input type="email" name="email" placeholder="Your email" required
                    style="flex: 1; min-width: 220px; padding: 13px 16px; border-radius: 10px; border: none;" />
                <button type="submit"
                    style="padding: 13px 24px; border-radius: 10px; border: none; background: var(--primary, #2563eb); color: #fff; font-weight: 700; cursor: pointer;">Subscribe</button>
            </form>
            <p class="newsletter-msg" style="min-height: 1.2em; margin-top: 12px; font-size: 0.95rem;"></p>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Hash Future School. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="blog.js"></script>
    <script src="newsletter.js"></script>
</body>

</html>
